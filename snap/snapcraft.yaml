name: registry
version: '0.1'
summary: CNCF Distribution Registry packaged as a snap
description: |
  [CNCF Distribution Registry](https://github.com/distribution/distribution/) packaged as a snap.

grade: stable
confinement: strict

base: core24

parts:
  misc:
    plugin: dump
    source: ./scripts
  registry:
    plugin: go
    source-type: git
    source: https://github.com/distribution/distribution/
    build-environment:
    - CGO_ENABLED: "0"
    build-snaps:
      - go
    prime:
    - bin/registry

apps:
  registry:
    command: run-registry
    daemon: simple
    plugs: [network-bind]
